name: Deploy Worker

# P6b deploy layer (ci-deploy PLAN Phase 5): deploy the MCP Cloudflare Worker
# from packages/mcp when main changes touch it.
#
# Skip-cleanly semantics (IMPLICIT_SPEC E2): `secrets` and `env` contexts are
# NOT available in job-level `if`, so the secret check is a guard STEP — the
# token is injected via step `env`, tested in shell, and the result exported
# as a step output that conditions every later step. With no
# CLOUDFLARE_API_TOKEN configured (the expected state until the user adds
# credentials) the job ends green in seconds with a ::notice:: and wrangler is
# never reached.
#
# Requires the surfaces-merge contract: packages/mcp/worker/wrangler.jsonc
# (config lives in worker/, so --config is passed explicitly — wrangler only
# auto-discovers configs at the working-directory root) and `npm run
# build:worker -w @lumen-seo/mcp` producing deployable output. The config
# carries no account_id by design (none exists yet): supply it via the
# CLOUDFLARE_ACCOUNT_ID secret when credentials arrive.

on:
  push:
    branches: [main]
    paths: ['packages/mcp/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions: { contents: read }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — skip cleanly when CLOUDFLARE_API_TOKEN is absent
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not configured — skipping Worker deploy (Worker remains deployable-but-not-deployed; add the secret to activate)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - run: npm run build:worker -w @lumen-seo/mcp
        if: steps.guard.outputs.skip != 'true'
      - name: Provision demo key secrets (skip when GOOGLE_API_KEY is absent)
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::notice::GOOGLE_API_KEY not configured — worker keeps header-only BYOK (keyless demo quota)"
            exit 0
          fi
          printf '%s' "$GOOGLE_API_KEY" | npx wrangler secret put LUMEN_PSI_KEY --config worker/wrangler.jsonc
          printf '%s' "$GOOGLE_API_KEY" | npx wrangler secret put LUMEN_CRUX_KEY --config worker/wrangler.jsonc
      - name: wrangler deploy
        if: steps.guard.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # required at deploy time: wrangler.jsonc intentionally carries no account_id
          command: deploy --config worker/wrangler.jsonc
          workingDirectory: packages/mcp
