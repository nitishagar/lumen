name: evals

on:
  push:
  pull_request:

jobs:
  evals:
    name: AI eval gate (evalite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Run offline eval suite (in-process tool contract)
        run: npm run test:evals
      # A failing eval fails this job via evalite's --threshold exit code.
      # The live judge case (packages/mcp/src/evals/judge.live.eval.ts) and the
      # red-team swarm (swarm.eval.ts) are evalite.skip'd here — the gate sets
      # SWARM_SKIP=1 here so the latency/size eval gate is deterministic; the
      # gated swarm runs in the job below (--threshold 100) and the judge needs a key
      # (docs/evals.md).

  swarm:
    name: Red-team swarm (gated at 100%)
    runs-on: ubuntu-latest
    # Report-only by construction: findings record, they never gate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Run swarm adversary suite (offline fixtures, gated --threshold 100)
        run: npm run test:swarm
      - name: Upload swarm scoreboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: swarm-scoreboard
          path: packages/mcp/.evalite/swarm-scoreboard.jsonl
          if-no-files-found: warn
